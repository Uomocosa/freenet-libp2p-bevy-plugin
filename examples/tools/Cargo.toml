[package]
name = "tools"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "telegram_send"
path = "src/bin/telegram_send.rs"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

[dependencies]
telegram-bot-helper = { path = "../../../telegram-bot-helper/crates/telegram-bot-helper" }
