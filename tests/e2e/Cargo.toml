[package]
name = "e2e"
version = "0.1.0"
edition.workspace = true
publish = false

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "freenet_harness"
path = "tests/freenet_harness.rs"

[[test]]
name = "contract_wire"
path = "tests/contract_wire.rs"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

[dependencies]
freenet-libp2p-bevy-plugin = { path = "../../crates/freenet-libp2p-bevy-plugin", features = ["e2e"] }
e2e_apps = { path = "../e2e_apps" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
freenet = "=0.2.155"
tempfile = "=3.27.0"
freenet-stdlib = { workspace = true, features = ["contract"] }
freenet-contract-harness = { git = "https://github.com/Uomocosa/freenet-contract-harness", tag = "v0.0.12" }
lobby_contract = { path = "../../crates/lobby-room/freenet_contract" }
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
serde.workspace = true
serde_json = "=1.0.154"
bincode.workspace = true
async-trait = "=0.1.92"
thiserror.workspace = true
derive_more = { workspace = true, features = ["deref", "display"] }
