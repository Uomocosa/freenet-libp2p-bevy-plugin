[package]
name = "lobby_room_e2e"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "lobby_room_e2e"
path = "app/lib.rs"

[[bin]]
name = "lobby_room_e2e"
path = "app/main.rs"

[[test]]
name = "e2e"
path = "main.rs"

[[test]]
name = "freenet_harness"
path = "contract/freenet_harness.rs"

[[test]]
name = "contract_wire"
path = "contract/contract_wire.rs"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui"] }
clap = { version = "=4.6.7", features = ["derive"] }
freenet-libp2p-bevy-plugin = { path = "../../crates/freenet-libp2p-bevy-plugin", features = ["e2e"] }
lobby_room = { path = "../../examples/lobby_room" }
serde.workspace = true
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
async-trait = "=0.1.92"
bincode.workspace = true
freenet-contract-harness = { git = "https://github.com/Uomocosa/freenet-contract-harness", tag = "v0.0.12" }
freenet-stdlib = { workspace = true, features = ["contract"] }
lobby_contract = { path = "../../crates/lobby-room/freenet_contract" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "=3.27.0"
