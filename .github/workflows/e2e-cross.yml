# Cross-OS e2e, see tests/CROSS-OS-PLAN.md. Manual trigger only: the peers run on
# self-hosted machines, and this repo is public.
name: e2e-cross

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario to run
        type: choice
        options: [s1, direct-dial]
        default: s1
      bundle_run_id:
        description: Reuse the bundles of this run and skip both builds
        type: string
        required: false
      network_label:
        description: Reporting only
        type: choice
        options: [lan, 5g]
        default: lan
      time_scale:
        description: E2E_TIME_SCALE, applied to the game and to every script deadline
        type: string
        default: "1"
      build_host:
        description: Where the Windows bundle is built
        type: choice
        options: [self-hosted, github]
        default: self-hosted
      record_video:
        description: Record both desktops and send the videos to Telegram; never uploaded as artifacts
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: e2e-cross

env:
  E2E_TIME_SCALE: ${{ inputs.time_scale }}
  RUST_LOG: info,starboard=debug,p2p=debug,discovery=debug,freenet_libp2p_bevy_plugin=debug
  BUNDLE_RUN_ID: ${{ inputs.bundle_run_id || github.run_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.ids.outputs.token }}
      script_w: ${{ steps.scenario.outputs.script_w }}
      script_l1: ${{ steps.scenario.outputs.script_l1 }}
      script_l2: ${{ steps.scenario.outputs.script_l2 }}
      expect: ${{ steps.scenario.outputs.expect }}
    steps:
      - uses: actions/checkout@v7
      - id: ids
        run: |
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "token=lobby-e2e/cross-$id" >> "$GITHUB_OUTPUT"
          echo "room=room-$id" >> "$GITHUB_OUTPUT"
      - id: scenario
        if: ${{ inputs.scenarios == 's1' }}
        env:
          SCENARIO: ${{ inputs.scenarios }}
          ROOM: ${{ steps.ids.outputs.room }}
        run: bash scripts/e2e_cross_scenario.sh "$SCENARIO" "$E2E_TIME_SCALE" "$ROOM" >> "$GITHUB_OUTPUT"

  build-windows:
    if: ${{ inputs.bundle_run_id == '' }}
    runs-on: ${{ inputs.build_host == 'github' && 'windows-latest' || fromJSON('["self-hosted", "windows-e2e"]') }}
    timeout-minutes: 350
    env:
      # The self-hosted PC is old and low on RAM: one worker, always.
      CARGO_BUILD_JOBS: ${{ inputs.build_host == 'github' && '4' || '1' }}
      CARGO_TARGET_DIR: C:\e2e\target
      RUSTFLAGS: -Clinker=rust-lld
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: |
          rustup toolchain install
          cargo build -p freenet-libp2p-bevy-plugin --profile ci-min --features e2e --example starboard --example e2e_check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lines = cmd /c 'cargo test -p e2e --test e2e --no-run --profile ci-min 2>&1'
          if ($LASTEXITCODE -ne 0) { $lines; exit $LASTEXITCODE }
          $testBin = ($lines | Select-String 'Executable .*tests[\\/]e2e[\\/]main\.rs \((.*)\)' | ForEach-Object { $_.Matches.Groups[1].Value } | Select-Object -First 1)
          if ([string]::IsNullOrEmpty($testBin)) { $lines; Write-Output '::error::e2e test binary not found'; exit 1 }
          $bundle = Join-Path $env:RUNNER_TEMP bundle
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item C:\e2e\target\ci-min\examples\starboard.exe, C:\e2e\target\ci-min\examples\e2e_check.exe $bundle
          Copy-Item $testBin (Join-Path $bundle 'e2e-direct-dial.exe')
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-windows
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 30

  build-linux:
    if: ${{ inputs.bundle_run_id == '' }}
    runs-on: [self-hosted, linux-e2e]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - run: |
          export CARGO_TARGET_DIR="$HOME/.cache/cargo-target/freenet-libp2p-bevy-plugin"
          cargo build -p freenet-libp2p-bevy-plugin --features e2e --example starboard
          test_bin=$(cargo test -p e2e --test e2e --no-run 2>&1 | tee /dev/stderr | sed -n 's/^ *Executable .*tests\/e2e\/main\.rs (\(.*\))$/\1/p' | head -n1)
          if [ ! -x "$test_bin" ]; then echo "::error::e2e test binary not found"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/bundle"
          cp "$CARGO_TARGET_DIR/debug/examples/starboard" "$RUNNER_TEMP/bundle/"
          cp "$test_bin" "$RUNNER_TEMP/bundle/e2e-direct-dial"
          ls "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-linux
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 30

  peers-windows:
    needs: [prepare, build-windows, build-linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.scenarios == 's1' }}
    runs-on: [self-hosted, windows-e2e]
    timeout-minutes: 30
    steps:
      # C:\e2e\bundle is the path of the firewall allow rule: never run the game elsewhere.
      - shell: powershell
        run: |
          Stop-Process -Name starboard -Force -ErrorAction SilentlyContinue
          Remove-Item C:\e2e\bundle\* -Force -ErrorAction SilentlyContinue
      - uses: actions/download-artifact@v8
        with:
          name: bundle-windows
          path: C:\e2e\bundle
          run-id: ${{ env.BUNDLE_RUN_ID }}
          github-token: ${{ github.token }}
      - shell: powershell
        env:
          TOKEN: ${{ needs.prepare.outputs.token }}
          SCRIPT: ${{ needs.prepare.outputs.script_w }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: |
          $results = Join-Path $env:RUNNER_TEMP results
          $peer = Join-Path $results w
          $node = Join-Path $env:RUNNER_TEMP node-w
          $videoDir = Join-Path $env:RUNNER_TEMP video
          $videoMkv = Join-Path $videoDir windows.mkv
          New-Item -ItemType Directory -Force $peer | Out-Null
          New-Item -ItemType Directory -Force $videoDir | Out-Null
          $recording = $null
          if ($env:RECORD_VIDEO -eq 'true') {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'ffmpeg'
            $psi.Arguments = "-nostats -loglevel error -y -f gdigrab -framerate 5 -i desktop -vf scale=960:-2 -c:v libx264 -preset ultrafast -crf 32 `"$videoMkv`""
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardInput = $true
            $recording = [System.Diagnostics.Process]::Start($psi)
          }
          $game = Start-Process C:\e2e\bundle\starboard.exe -PassThru -Wait -RedirectStandardOutput "$peer\instance-w.log" -RedirectStandardError "$peer\instance-w.err.log" -ArgumentList "--username w --token `"$env:TOKEN`" --transport both --script `"$env:SCRIPT`" --freenet-node-dir `"$node`" --result-json `"$peer\result.json`""
          if ($recording) { $recording.StandardInput.Write('q'); $recording.StandardInput.Flush(); if (-not $recording.WaitForExit(20000)) { $recording.Kill() } }
          Get-ChildItem $node -Recurse -Filter *.log -ErrorAction SilentlyContinue | Copy-Item -Destination $peer
          exit $game.ExitCode
      - name: Send Windows video to Telegram
        if: ${{ always() && inputs.record_video }}
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCENARIO: ${{ inputs.scenarios }}
          NETWORK_LABEL: ${{ inputs.network_label }}
        run: |
          $videoDir = Join-Path $env:RUNNER_TEMP video
          $videoMkv = Join-Path $videoDir windows.mkv
          $videoMp4 = Join-Path $videoDir windows.mp4
          if ([string]::IsNullOrEmpty($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrEmpty($env:TELEGRAM_CHAT_ID)) {
            Write-Output '::warning::Telegram secrets not set, skipping video upload'
            exit 0
          }
          if (-not (Test-Path $videoMkv)) {
            Write-Output '::warning::Video file missing, skipping Telegram upload'
            exit 0
          }
          & ffmpeg -nostats -loglevel error -y -i $videoMkv -c copy -movflags +faststart $videoMp4
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning::ffmpeg remux failed, skipping Telegram upload'
            exit 0
          }
          $caption = "$env:SCENARIO on $env:NETWORK_LABEL, windows, run $env:GITHUB_RUN_ID"
          & curl.exe -sS --fail -o NUL -X POST "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendVideo" -F "chat_id=$env:TELEGRAM_CHAT_ID" -F "caption=$caption" -F "video=@$videoMp4"
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning::Telegram sendVideo failed (bot upload limit is 50 MB), video not delivered'
            exit 0
          }
          exit 0
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: results-windows
          path: ${{ runner.temp }}/results
          retention-days: 7

  peers-linux:
    needs: [prepare, build-windows, build-linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.scenarios == 's1' }}
    runs-on: [self-hosted, linux-e2e]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundle-linux
          path: ${{ runner.temp }}/bundle
          run-id: ${{ env.BUNDLE_RUN_ID }}
          github-token: ${{ github.token }}
      - env:
          TOKEN: ${{ needs.prepare.outputs.token }}
          SCRIPT_L1: ${{ needs.prepare.outputs.script_l1 }}
          SCRIPT_L2: ${{ needs.prepare.outputs.script_l2 }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: |
          bin="$RUNNER_TEMP/bundle/starboard"
          results="$RUNNER_TEMP/results"
          video_dir="$RUNNER_TEMP/video"
          video_mkv="$video_dir/linux.mkv"
          chmod +x "$bin"
          mkdir -p "$results" "$video_dir"
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          export VK_ICD_FILENAMES
          recording=""
          if [ "$RECORD_VIDEO" = "true" ]; then
            size=$(xdpyinfo | awk '/dimensions:/ {print $2}')
            ffmpeg -nostats -loglevel error -y -f x11grab -framerate 5 -video_size "$size" -i "$DISPLAY" \
              -vf scale=960:-2 -c:v libx264 -preset ultrafast -crf 32 "$video_mkv" &
            recording=$!
          fi
          run_peer() {
            mkdir -p "$results/$1"
            "$bin" --username "$1" --token "$TOKEN" --transport both --script "$2" \
              --freenet-node-dir "$RUNNER_TEMP/node-$1" --result-json "$results/$1/result.json" \
              > "$results/$1/instance-$1.log" 2>&1
          }
          place_window() {
            timeout 120 xdotool search --sync --onlyvisible --name "^starboard-$1$" windowmove %@ "$2" 40 || echo "::warning::place_window $1 failed"
          }
          run_peer l1 "$SCRIPT_L1" & first=$!
          run_peer l2 "$SCRIPT_L2" & second=$!
          # Tile windows side by side so scripted clicks land on the right peer.
          place_window l1 0 &
          place_window l2 960 &
          failed=0
          wait "$first" || failed=1
          wait "$second" || failed=1
          if [ -n "$recording" ]; then kill "$recording" || true; fi
          for peer in l1 l2; do
            find "$RUNNER_TEMP/node-$peer" -name '*.log' -exec cp -t "$results/$peer" {} + || true
          done
          exit "$failed"
      - name: Send Linux video to Telegram
        if: ${{ always() && inputs.record_video }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCENARIO: ${{ inputs.scenarios }}
          NETWORK_LABEL: ${{ inputs.network_label }}
        run: |
          mkv="$RUNNER_TEMP/video/linux.mkv"
          mp4="$RUNNER_TEMP/video/linux.mp4"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not set, skipping video upload"
            exit 0
          fi
          if [ ! -f "$mkv" ]; then
            echo "::warning::Video file missing, skipping Telegram upload"
            exit 0
          fi
          if ! ffmpeg -nostats -loglevel error -y -i "$mkv" -c copy -movflags +faststart "$mp4"; then
            echo "::warning::ffmpeg remux failed, skipping Telegram upload"
            exit 0
          fi
          caption="$SCENARIO on $NETWORK_LABEL, linux, run $GITHUB_RUN_ID"
          if ! curl -sS --fail -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" -F "chat_id=$TELEGRAM_CHAT_ID" -F "caption=$caption" -F "video=@$mp4"; then
            echo "::warning::Telegram sendVideo failed (bot upload limit is 50 MB), video not delivered"
            exit 0
          fi
          exit 0
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: results-linux
          path: ${{ runner.temp }}/results
          retention-days: 7

  check:
    needs: [prepare, peers-windows, peers-linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.scenarios == 's1' }}
    runs-on: [self-hosted, windows-e2e]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundle-windows
          path: C:\e2e\bundle
          run-id: ${{ env.BUNDLE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - shell: powershell
        env:
          EXPECT: ${{ needs.prepare.outputs.expect }}
          SCENARIO: ${{ inputs.scenarios }}
          NETWORK_LABEL: ${{ inputs.network_label }}
        run: |
          $arguments = @('--results-dir', (Join-Path $env:RUNNER_TEMP results), '--peer', 'w', '--peer', 'l1', '--peer', 'l2')
          foreach ($expectation in $env:EXPECT -split ' ') { $arguments += @('--expect', $expectation) }
          $table = & C:\e2e\bundle\e2e_check.exe @arguments
          $code = $LASTEXITCODE
          $table
          "## $env:SCENARIO on $env:NETWORK_LABEL" | Add-Content $env:GITHUB_STEP_SUMMARY
          $table | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code

  peers-windows-direct:
    needs: [build-windows, build-linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.scenarios == 'direct-dial' }}
    runs-on: [self-hosted, windows-e2e]
    timeout-minutes: 30
    steps:
      # C:\e2e\bundle is the path of the firewall allow rule: never run the game elsewhere.
      - shell: powershell
        run: |
          Stop-Process -Name starboard -Force -ErrorAction SilentlyContinue
          Remove-Item C:\e2e\bundle\* -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP results) -Recurse -Force -ErrorAction SilentlyContinue
      - uses: actions/download-artifact@v8
        with:
          name: bundle-windows
          path: C:\e2e\bundle
          run-id: ${{ env.BUNDLE_RUN_ID }}
          github-token: ${{ github.token }}
      - shell: powershell
        env:
          E2E_MACHINE: w
          E2E_BOARD: github
          E2E_GAME_BIN: C:\e2e\bundle\starboard.exe
          E2E_TIME_SCALE: ${{ inputs.time_scale }}
          GITHUB_TOKEN: ${{ github.token }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: |
          $results = Join-Path $env:RUNNER_TEMP results
          $videoDir = Join-Path $env:RUNNER_TEMP video
          $videoMkv = Join-Path $videoDir windows.mkv
          New-Item -ItemType Directory -Force $results | Out-Null
          New-Item -ItemType Directory -Force $videoDir | Out-Null
          $testBin = 'C:\e2e\bundle\e2e-direct-dial.exe'
          $recording = $null
          if ($env:RECORD_VIDEO -eq 'true') {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'ffmpeg'
            $psi.Arguments = "-nostats -loglevel error -y -f gdigrab -framerate 5 -i desktop -vf scale=960:-2 -c:v libx264 -preset ultrafast -crf 32 `"$videoMkv`""
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardInput = $true
            $recording = [System.Diagnostics.Process]::Start($psi)
          }
          # Linux dials Windows: the Linux runner firewall drops inbound connections.
          $env:E2E_PLACEMENT = 'alice=l,bob=w'
          $env:E2E_BOARD_RUN_ID = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-direct_dial"
          $env:E2E_RUN_DIR = Join-Path $results direct_dial
          New-Item -ItemType Directory -Force $env:E2E_RUN_DIR | Out-Null
          & $testBin direct_dial --ignored --nocapture
          $first = $LASTEXITCODE
          $env:E2E_PLACEMENT = 'alice=w,bob=l'
          $env:E2E_BOARD_RUN_ID = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-friends_reconnect"
          $env:E2E_RUN_DIR = Join-Path $results friends_reconnect
          New-Item -ItemType Directory -Force $env:E2E_RUN_DIR | Out-Null
          & $testBin friends_reconnect --ignored --nocapture
          $second = $LASTEXITCODE
          if ($recording) { $recording.StandardInput.Write('q'); $recording.StandardInput.Flush(); if (-not $recording.WaitForExit(20000)) { $recording.Kill() } }
          if ($first -ne 0) { exit $first }
          exit $second
      - name: Send Windows video to Telegram
        if: ${{ always() && inputs.record_video }}
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCENARIO: ${{ inputs.scenarios }}
          NETWORK_LABEL: ${{ inputs.network_label }}
        run: |
          $videoDir = Join-Path $env:RUNNER_TEMP video
          $videoMkv = Join-Path $videoDir windows.mkv
          $videoMp4 = Join-Path $videoDir windows.mp4
          if ([string]::IsNullOrEmpty($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrEmpty($env:TELEGRAM_CHAT_ID)) {
            Write-Output '::warning::Telegram secrets not set, skipping video upload'
            exit 0
          }
          if (-not (Test-Path $videoMkv)) {
            Write-Output '::warning::Video file missing, skipping Telegram upload'
            exit 0
          }
          & ffmpeg -nostats -loglevel error -y -i $videoMkv -c copy -movflags +faststart $videoMp4
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning::ffmpeg remux failed, skipping Telegram upload'
            exit 0
          }
          $caption = "$env:SCENARIO on $env:NETWORK_LABEL, windows, run $env:GITHUB_RUN_ID"
          & curl.exe -sS --fail -o NUL -X POST "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendVideo" -F "chat_id=$env:TELEGRAM_CHAT_ID" -F "caption=$caption" -F "video=@$videoMp4"
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning::Telegram sendVideo failed (bot upload limit is 50 MB), video not delivered'
            exit 0
          }
          exit 0
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: results-windows-direct
          path: ${{ runner.temp }}/results
          retention-days: 7

  peers-linux-direct:
    needs: [build-windows, build-linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.scenarios == 'direct-dial' }}
    runs-on: [self-hosted, linux-e2e]
    timeout-minutes: 30
    steps:
      - run: |
          rm -rf "$RUNNER_TEMP/results"
      - uses: actions/download-artifact@v8
        with:
          name: bundle-linux
          path: ${{ runner.temp }}/bundle
          run-id: ${{ env.BUNDLE_RUN_ID }}
          github-token: ${{ github.token }}
      - env:
          E2E_MACHINE: l
          E2E_BOARD: github
          E2E_TIME_SCALE: ${{ inputs.time_scale }}
          GITHUB_TOKEN: ${{ github.token }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: |
          bin="$RUNNER_TEMP/bundle/e2e-direct-dial"
          game="$RUNNER_TEMP/bundle/starboard"
          results="$RUNNER_TEMP/results"
          export E2E_GAME_BIN="$game"
          video_dir="$RUNNER_TEMP/video"
          video_mkv="$video_dir/linux.mkv"
          chmod +x "$bin" "$game"
          mkdir -p "$results" "$video_dir"
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          export VK_ICD_FILENAMES
          recording=""
          if [ "$RECORD_VIDEO" = "true" ]; then
            size=$(xdpyinfo | awk '/dimensions:/ {print $2}')
            ffmpeg -nostats -loglevel error -y -f x11grab -framerate 5 -video_size "$size" -i "$DISPLAY" \
              -vf scale=960:-2 -c:v libx264 -preset ultrafast -crf 32 "$video_mkv" &
            recording=$!
          fi
          # Linux dials Windows: the Linux runner firewall drops inbound connections.
          export E2E_PLACEMENT=alice=l,bob=w
          export E2E_BOARD_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-direct_dial"
          export E2E_RUN_DIR="$results/direct_dial"
          mkdir -p "$E2E_RUN_DIR"
          "$bin" direct_dial --ignored --nocapture
          first=$?
          export E2E_PLACEMENT=alice=w,bob=l
          export E2E_BOARD_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-friends_reconnect"
          export E2E_RUN_DIR="$results/friends_reconnect"
          mkdir -p "$E2E_RUN_DIR"
          "$bin" friends_reconnect --ignored --nocapture
          second=$?
          if [ -n "$recording" ]; then kill "$recording" || true; fi
          if [ "$first" -ne 0 ]; then exit "$first"; fi
          exit "$second"
      - name: Send Linux video to Telegram
        if: ${{ always() && inputs.record_video }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCENARIO: ${{ inputs.scenarios }}
          NETWORK_LABEL: ${{ inputs.network_label }}
        run: |
          mkv="$RUNNER_TEMP/video/linux.mkv"
          mp4="$RUNNER_TEMP/video/linux.mp4"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not set, skipping video upload"
            exit 0
          fi
          if [ ! -f "$mkv" ]; then
            echo "::warning::Video file missing, skipping Telegram upload"
            exit 0
          fi
          if ! ffmpeg -nostats -loglevel error -y -i "$mkv" -c copy -movflags +faststart "$mp4"; then
            echo "::warning::ffmpeg remux failed, skipping Telegram upload"
            exit 0
          fi
          caption="$SCENARIO on $NETWORK_LABEL, linux, run $GITHUB_RUN_ID"
          if ! curl -sS --fail -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" -F "chat_id=$TELEGRAM_CHAT_ID" -F "caption=$caption" -F "video=@$mp4"; then
            echo "::warning::Telegram sendVideo failed (bot upload limit is 50 MB), video not delivered"
            exit 0
          fi
          exit 0
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: results-linux-direct
          path: ${{ runner.temp }}/results
          retention-days: 7

  check-direct:
    needs: [peers-windows-direct, peers-linux-direct]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.scenarios == 'direct-dial' }}
    runs-on: [self-hosted, windows-e2e]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundle-windows
          path: C:\e2e\bundle
          run-id: ${{ env.BUNDLE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*-direct
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - shell: powershell
        env:
          SCENARIO: ${{ inputs.scenarios }}
          NETWORK_LABEL: ${{ inputs.network_label }}
        run: |
          $env:E2E_ROLE = 'check'
          $results = Join-Path $env:RUNNER_TEMP results
          $testBin = 'C:\e2e\bundle\e2e-direct-dial.exe'
          "## $env:SCENARIO on $env:NETWORK_LABEL" | Add-Content $env:GITHUB_STEP_SUMMARY
          $failed = $false
          foreach ($test in @('direct_dial', 'friends_reconnect')) {
            $env:E2E_RESULTS_DIR = Join-Path $results $test
            $table = cmd /c "`"$testBin`" $test --ignored --nocapture 2>&1"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            $table
            "### $test" | Add-Content $env:GITHUB_STEP_SUMMARY
            $table | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if ($failed) { exit 1 }
          exit 0
