[package]
name = "common_types"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
bevy = ["dep:bevy_reflect"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
derive_more = { version = "=2.1.1", features = ["deref"] }
bevy_reflect = { version = "=0.20.1", optional = true }
atomic-delegate-macros = { git = "https://github.com/Uomocosa/lele-rust-linter", tag = "v0.0.11" }

[dev-dependencies]
rstest = "=0.28.0"
bincode = "=1.3.3"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"
