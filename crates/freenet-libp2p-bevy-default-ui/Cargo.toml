[package]
name = "freenet-libp2p-bevy-default-ui"
version.workspace = true
edition.workspace = true
description = "Default Bevy UI for freenet-libp2p-bevy-plugin (lobby + friends tabs) — depends on freenet-libp2p-bevy-core"
license.workspace = true

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

[dependencies]
freenet-libp2p-bevy-core = { path = "../freenet-libp2p-bevy-core", features = ["discovery"] }
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui"] }
atomic-delegate-macros.workspace = true
derive_more = { workspace = true, features = ["deref", "deref_mut"] }
tracing = "=0.1.44"

[dev-dependencies]
freenet-libp2p-bevy-core = { path = "../freenet-libp2p-bevy-core", features = ["testing"] }
lele-bevy-preview = { git = "https://github.com/Uomocosa/telegram-bot-helper", tag = "v0.0.15" }
lele-bevy-state-machine = { workspace = true, features = ["testing"] }
libp2p = { version = "=0.57.1", features = ["tokio", "quic", "tcp", "noise", "yamux", "dns", "identify", "ping", "relay", "dcutr", "request-response", "kad", "gossipsub", "mdns", "macros"] }
