[package]
name = "common_types"
version = "0.1.0"
edition = "2024"

[features]
bevy = ["dep:bevy_reflect", "dep:lele-bevy-state-machine"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
lele-bevy-state-machine = { path = "../../../lele-bevy-state-machine", optional = true }
derive_more = { version = "=2.1.1", features = ["deref", "deref_mut", "display", "from"] }
bevy_reflect = { version = "=0.20.1", optional = true }
atomic-delegate-macros = { path = "../../../lele-rust-linter/crates/atomic-delegate-macros" }
thiserror = "=2.0.21"
blake3 = "=1.8.7"
multiaddr = "=0.19.1"
libp2p-identity = { version = "=0.3.1", features = ["peerid"] }

[dev-dependencies]
rstest = "=0.28.0"
bincode = "=1.3.3"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"
