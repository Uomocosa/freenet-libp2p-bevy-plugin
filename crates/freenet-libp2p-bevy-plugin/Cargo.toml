[package]
name = "freenet-libp2p-bevy-plugin"
version = "0.0.9"
edition = "2024"
description = "Generic P2PBevyPlugin (Freenet discovery + libp2p Kademlia history) — Freenet lobby contract"
license = "MIT OR Apache-2.0"

[[bin]]
name = "new-game-id"
path = "src/bin/new_game_id.rs"

[[example]]
name = "e2e_check"
path = "examples/e2e_check/main.rs"
required-features = ["e2e"]

[[example]]
name = "lobby_room"
path = "examples/lobby_room/main.rs"
required-features = ["e2e"]

[[example]]
name = "starboard"
path = "examples/starboard/main.rs"
required-features = ["e2e"]

[[test]]
name = "lobby_room_discovery"
path = "tests/lobby_room_discovery.rs"
required-features = ["e2e"]

[[test]]
name = "lobby_room_join"
path = "tests/lobby_room_join.rs"
required-features = ["e2e"]

[[test]]
name = "room_messaging"
path = "tests/room_messaging.rs"
required-features = ["e2e"]

[[test]]
name = "starboard_e2e"
path = "tests/starboard_e2e.rs"
required-features = ["e2e"]

[[test]]
name = "starboard_history"
path = "tests/starboard_history.rs"
required-features = ["e2e"]

[[test]]
name = "starboard_scenarios"
path = "tests/starboard_scenarios.rs"
required-features = ["e2e"]

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]

[[test]]
name = "contract_wire"
path = "tests/contract_wire.rs"

[[test]]
name = "freenet_harness"
path = "tests/freenet_harness.rs"

[[test]]
name = "freenet_relaunch"
path = "tests/freenet_relaunch.rs"
required-features = ["e2e"]

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

[dependencies]
async-trait = "=0.1.92"
atomic-delegate-macros = { path = "../../../lele-rust-linter/crates/atomic-delegate-macros" }
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui"] }
common_types = { path = "../common_types", features = ["bevy"] }
lele-bevy-state-machine = { path = "../../../lele-bevy-state-machine" }
derive_more = { version = "=2.1.1", features = ["deref", "deref_mut", "display", "from"] }
libp2p = { version = "=0.57.1", features = ["tokio", "quic", "tcp", "noise", "yamux", "dns", "identify", "ping", "relay", "dcutr", "request-response", "kad", "gossipsub", "mdns", "macros"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.229", features = ["derive"] }
bincode = "=1.3.3"
zstd = "=0.14.3"
futures = "=0.3.34"
futures-util = "=0.3.34"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
freenet-stdlib = { version = "=0.12.1", features = ["net"], optional = true }
tokio-tungstenite = { version = "=0.27.0", optional = true }
http = { version = "=1.5.0", optional = true }
serde_json = "=1.0.154"

[features]
default = ["discovery", "default_ui"]
discovery = [
    "dep:freenet-stdlib",
    "dep:tokio-tungstenite",
    "dep:http",
]
default_ui = ["discovery"]
testing = ["discovery", "tokio/net"]
e2e = ["discovery", "default_ui", "testing"]

[dev-dependencies]
e2e_macros = { path = "tests/e2e/macros" }
lele-bevy-state-machine = { path = "../../../lele-bevy-state-machine", features = ["testing"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
telegram-bot-helper = { path = "../../../telegram-bot-helper/crates/telegram-bot-helper" }
lele-bevy-preview = { path = "../../../telegram-bot-helper/crates/lele-bevy-preview" }
rstest = "=0.28.0"
freenet = "=0.2.155"
tempfile = "=3.27.0"
freenet-stdlib = { version = "=0.12.1", features = ["contract"] }
freenet-contract-harness = { path = "../../../freenet-contract-harness" }
lobby_contract = { path = "../lobby_contract" }
