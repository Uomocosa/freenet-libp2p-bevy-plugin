[package]
name = "freenet-libp2p-bevy-plugin"
version = "0.0.9"
edition.workspace = true
description = "Generic P2PBevyPlugin (Freenet discovery + libp2p Kademlia history) — Freenet lobby contract"
license.workspace = true

[[bin]]
name = "new-game-id"
path = "src/bin/new_game_id.rs"

[[example]]
name = "e2e_check"
path = "examples/e2e_check/main.rs"
required-features = ["e2e"]

[[example]]
name = "lobby_room"
path = "examples/lobby_room/main.rs"
required-features = ["e2e"]

[[example]]
name = "starboard"
path = "examples/starboard/main.rs"
required-features = ["e2e"]

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

[dependencies]
async-trait = "=0.1.92"
atomic-delegate-macros.workspace = true
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui"] }
common_types = { workspace = true, features = ["bevy"] }
lele-bevy-state-machine.workspace = true
derive_more = { workspace = true, features = ["deref", "deref_mut", "display", "from"] }
libp2p = { version = "=0.57.1", features = ["tokio", "quic", "tcp", "noise", "yamux", "dns", "identify", "ping", "relay", "dcutr", "request-response", "kad", "gossipsub", "mdns", "macros"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
thiserror.workspace = true
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde.workspace = true
bincode.workspace = true
zstd = "=0.14.3"
futures = "=0.3.34"
futures-util = "=0.3.34"
blake3.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
freenet-stdlib = { workspace = true, features = ["net"], optional = true }
tokio-tungstenite = { version = "=0.27.0", optional = true }
http = { version = "=1.5.0", optional = true }
serde_json = "=1.0.154"

[features]
default = ["discovery", "default_ui"]
discovery = [
    "dep:freenet-stdlib",
    "dep:tokio-tungstenite",
    "dep:http",
]
default_ui = ["discovery"]
testing = ["discovery", "tokio/net"]
e2e = ["discovery", "default_ui", "testing"]

[dev-dependencies]
lele-bevy-state-machine = { workspace = true, features = ["testing"] }
telegram-bot-helper = { path = "../../../telegram-bot-helper/crates/telegram-bot-helper" }
lele-bevy-preview = { path = "../../../telegram-bot-helper/crates/lele-bevy-preview" }
freenet = "=0.2.155"
tempfile = "=3.27.0"
freenet-stdlib = { workspace = true, features = ["contract"] }
