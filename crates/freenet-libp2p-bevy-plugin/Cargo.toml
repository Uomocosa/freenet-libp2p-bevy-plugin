[package]
name = "freenet-libp2p-bevy-plugin"
version.workspace = true
edition.workspace = true
description = "Generic P2PBevyPlugin (Freenet discovery + libp2p Kademlia history) — Freenet lobby contract"
license.workspace = true

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

[dependencies]
freenet-libp2p-bevy-core = { path = "../freenet-libp2p-bevy-core", default-features = false }
freenet-libp2p-bevy-lobby-room = { path = "../freenet-libp2p-bevy-lobby-room", optional = true }

[features]
default = ["lobby-room"]
lobby-room = ["dep:freenet-libp2p-bevy-lobby-room"]
testing = ["lobby-room", "freenet-libp2p-bevy-core/testing", "freenet-libp2p-bevy-lobby-room/testing"]
e2e = ["testing"]
