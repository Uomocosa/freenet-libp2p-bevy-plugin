[package]
name = "lobby_contract"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[dependencies]
common_types.workspace = true
derive_more = { workspace = true, features = ["deref"] }
freenet-stdlib = { workspace = true, features = ["contract"] }
freenet-macros = "=0.3.1"
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true

[dev-dependencies]
rstest.workspace = true
freenet-libp2p-bevy-plugin = { path = "../freenet-libp2p-bevy-plugin" }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
# Size optimizations, kept off on purpose: build time matters more until the app is finished.
# Enabling them shrinks the wasm and changes the contract key, which is fine at that point.
# [profile.release]
# opt-level = 'z'
# lto = true
# codegen-units = 1
# panic = 'abort'
# strip = true
