[workspace]
resolver = "3"
members = [
    "crates/common_types",
    "crates/lobby_contract",
    "crates/freenet-libp2p-bevy-plugin",
    "examples/e2e_check",
    "examples/lobby_room",
    "examples/shared",
    "examples/starboard",
    "examples/tools",
    "tests/e2e",
    "tests/e2e_macros",
    "tests/e2e_steps",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
derive_more = { version = "=2.1.1" }
thiserror = "=2.0.21"
blake3 = "=1.8.7"
bincode = "=1.3.3"
rstest = "=0.28.0"
freenet-stdlib = { version = "=0.12.1" }
atomic-delegate-macros = { path = "../lele-rust-linter/crates/atomic-delegate-macros" }
lele-bevy-state-machine = { path = "../lele-bevy-state-machine" }
common_types = { path = "crates/common_types" }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# `opt-level = 3` on every dependency pushed cold builds into OOM on 14 GB machines.
# Debug info is the other big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

# The heaviest rustc invocations on a cold build (peak RSS at opt-level 1 / 0:
# bevy_pbr 6.9 / 6.4 GB, freenet 5.1 / 4.4 GB, bevy_render 4.5 / 4.3 GB).
[profile.dev.package.bevy_pbr]
opt-level = 0

[profile.dev.package.bevy_render]
opt-level = 0

[profile.dev.package.freenet]
opt-level = 0

# CROSS-OS-PLAN §4: the Windows bundle build. The machine is old and low on RAM,
# so nothing is optimised and no debug or incremental data is kept.
[profile.ci-min]
inherits = "dev"
opt-level = 0
debug = false
incremental = false

[profile.ci-min.package."*"]
opt-level = 0
debug = false
