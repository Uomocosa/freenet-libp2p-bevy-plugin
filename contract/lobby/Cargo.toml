[package]
name = "lobby_contract"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[dependencies]
derive_more = { version = "=2.1.1", features = ["deref"] }
freenet-stdlib = { version = "=0.8.5", features = ["contract"] }
freenet-macros = "=0.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"
thiserror = "=2.0.18"

[dev-dependencies]
rstest = "=0.28.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
